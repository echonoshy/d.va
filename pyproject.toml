[project]
name = "d-va"
version = "0.2.1"
description = "D.va AI driven podcast."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.3.0",
    "cachetools==5.3.0",
    "cn2an==0.5.23",
    "einx==0.3.0",
    "ema_pytorch==0.7.7",
    "emojiswitch==0.0.3",
    "eng_to_ipa==0.0.2",
    "ftfy>=6.3.1",
    "inflect==7.5.0",
    "jieba==0.42.1",
    "langdetect==1.0.9",
    "librosa==0.10.2.post1",
    "lightning==2.5.0.post0",
    "loguru>=0.7.3",
    "loralib==0.1.2",
    "lxml>=6.1.0",
    "matplotlib>=3.9,<4",
    "mistune>=3.3.3",
    "natsort==8.4.0",
    "numba==0.61.0",
    "omegaconf==2.3.0",
    "openai>=1.75.0,<3",
    "psutil>=5.9.4",
    "pybase16384>=0.3.8",
    "pydub==0.25.1",
    "pypinyin==0.53.0",
    "pyrubberband==0.4.0",
    "pysubs2==1.8.0",
    "python_box==7.3.2",
    "pytorch_lightning==2.5.0.post0",
    "pyyaml>=6.0.1",
    "soundfile>=0.13.1",
    "tiktoken>=0.8.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchdiffeq==0.2.5",
    "tqdm>=4.67.1",
    "transformers==4.41.1",
    "Unidecode==1.3.8",
    "vector-quantize-pytorch>=1.22.15,<1.28",
    "vocos==0.1.0",
    "zhconv==1.4.3",
    "zhon>=2.1.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.26",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scipy>=1.16.3,<1.18",
    "requests>=2.32.4",
    "huggingface-hub>=0.30.2,<1",
    "hydra-core==1.3.8",
    "rich",
    "pydantic>=2.8,<3",
    "python-dotenv",
    "markdown-it-py",
    "safetensors",
    "pillow>=13.0.0",
    "moviepy==1.0.3",
    "python-ms>=1.1.1",
]

[project.optional-dependencies]
english-tn = [
    "wetextprocessing==1.3.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[tool.ruff]
line-length = 200
extend-exclude = [
    "modules/repos_static",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff.lint]
extend-select = ["ASYNC", "ASYNC1"]
ignore = ["E402"]
